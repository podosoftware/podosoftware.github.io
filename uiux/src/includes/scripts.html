<!-- ═══ 공통 스크립트 ═══ -->
<script>
  // ┌─ 사이드바 토글 ─────────────────────────────────────────┐
  const Sidebar = {
    state: { isOpen: false },
    selectors: {
      container: '#sidebar',
      overlay: '#sidebar-overlay',
    },

    toggle() {
      this.state.isOpen ? this.close() : this.open();
    },

    open() {
      this.state.isOpen = true;
      document.querySelector(this.selectors.container)?.classList.add('open');
      document.querySelector(this.selectors.overlay)?.classList.add('show');
      document.body.style.overflow = 'hidden';
    },

    close() {
      this.state.isOpen = false;
      document.querySelector(this.selectors.container)?.classList.remove('open');
      document.querySelector(this.selectors.overlay)?.classList.remove('show');
      document.body.style.overflow = '';
    }
  };

  function toggleSidebar() {
    Sidebar.toggle();
  }

  function closeSidebar() {
    Sidebar.close();
  }
  // └─────────────────────────────────────────────────────────┘


  // ┌─ 검색 기능 ─────────────────────────────────────────────┐
  const Search = {
    state: { isOpen: false },
    selectors: {
      modal: '#search-modal',
      input: '#search-input',
      results: '#search-results',
    },

    items: [
      { group: '시작하기', label: '개요', path: 'overview.html' },
      { group: '시작하기', label: '환경 설정', path: 'settings.html' },
      { group: '디자인 토큰', label: '컬러 토큰', path: 'color-tokens.html' },
      { group: '디자인 토큰', label: '타이포그래피 토큰', path: 'typography-tokens.html' },
      { group: '디자인 토큰', label: '간격·사이즈', path: 'sizing.html' },
      { group: '아이콘 시스템', label: '아이콘 개요', path: 'icons-overview.html' },
      { group: '아이콘 시스템', label: '사용법', path: 'icons-usage.html' },
      { group: 'Kendo UI', label: 'Grid', path: 'kendo-grid.html' },
      { group: 'Kendo UI', label: 'DropDownList', path: 'kendo-dropdown.html' },
      { group: 'Kendo UI', label: 'DatePicker', path: 'kendo-datepicker.html' },
      { group: 'Kendo UI', label: 'Window', path: 'kendo-window.html' },
    ],

    init() {
      this._setupEventListeners();
    },

    open() {
      this.state.isOpen = true;
      document.querySelector(this.selectors.modal)?.classList.add('open');
      setTimeout(() => {
        document.querySelector(this.selectors.input)?.focus();
      }, 50);
      this.render('');
    },

    close() {
      this.state.isOpen = false;
      document.querySelector(this.selectors.modal)?.classList.remove('open');
      const input = document.querySelector(this.selectors.input);
      if (input) input.value = '';
    },

    render(query) {
      const resultsEl = document.querySelector(this.selectors.results);
      if (!resultsEl) return;

      const filtered = query
        ? this.items.filter(item =>
            item.label.includes(query) || item.group.includes(query)
          )
        : this.items.slice(0, 6);

      if (!filtered.length) {
        resultsEl.innerHTML = '<div class="search-empty">검색 결과가 없습니다</div>';
        return;
      }

      resultsEl.innerHTML = filtered
        .map(item => this._createSearchItem(item))
        .join('');
    },

    _createSearchItem(item) {
      return `
        <a href="${item.path}" class="search-item" onclick="Search.close();">
          <div class="search-item-icon">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <path d="M2 1.5h7a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H2"/>
              <path d="M2 12.5V1.5"/>
            </svg>
          </div>
          <div>
            <div class="search-item-group">${item.group}</div>
            <div class="search-item-label">${item.label}</div>
          </div>
        </a>`;
    },

    _setupEventListeners() {
      document.addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          this.open();
        }
        if (e.key === 'Escape') {
          this.close();
        }
      });

      const modal = document.querySelector(this.selectors.modal);
      if (modal) {
        modal.addEventListener('click', e => {
          if (e.target === modal) {
            this.close();
          }
        });
      }

      const input = document.querySelector(this.selectors.input);
      if (input) {
        input.addEventListener('input', e => {
          this.render(e.target.value);
        });
      }
    }
  };

  function openSearch() {
    Search.open();
  }

  function closeSearch() {
    Search.close();
  }

  function doSearch(q) {
    Search.render(q);
  }
  // └─────────────────────────────────────────────────────────┘


  // ┌─ UI 유틸 ──────────────────────────────────────────────┐
  const UI = {
    copyCode(btn, id) {
      const text = document.getElementById(id)?.textContent;
      if (!text) return;

      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.textContent;
        btn.textContent = 'copied ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('copied');
        }, 1800);
      }).catch(err => {
        console.error('복사 실패:', err);
      });
    },

    smoothScroll(id) {
      document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
    },

    setupScrollEffects() {
      const topbar = document.querySelector('#topbar');
      if (!topbar) return;

      window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        topbar.style.borderBottomColor =
          scrollTop > 4 ? 'var(--rule)' : 'transparent';
      });
    }
  };

  function copyCode(btn, id) {
    UI.copyCode(btn, id);
  }

  function smoothScroll(id) {
    UI.smoothScroll(id);
  }
  // └─────────────────────────────────────────────────────────┘


  // ┌─ 초기화 ────────────────────────────────────────────────┐
  function initPage() {
    Search.init();
    UI.setupScrollEffects();
    console.log('✓ Page initialized (MPA mode)');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPage);
  } else {
    initPage();
  }
  // └─────────────────────────────────────────────────────────┘
</script>
