<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publisher Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───────── TOKENS ───────── */
:root {
  --bg:        #f7f6f2;
  --bg2:       #ffffff;
  --bg3:       #f0efe9;
  --sidebar-bg:#1a1a1a;
  --sidebar-fg:#a8a8a0;
  --sidebar-hover:#2a2a2a;
  --sidebar-active:#ffffff;
  --sidebar-accent:#c8f264;
  --text:      #1a1a1a;
  --text2:     #5a5a52;
  --text3:     #9a9a90;
  --border:    #e2e0d8;
  --border2:   #ccc9be;
  --accent:    #1a1a1a;
  --accent-bg: #c8f264;
  --info-bg:   #eef7ff;
  --info-border:#b3d9ff;
  --info-text: #0062cc;
  --warn-bg:   #fffbea;
  --warn-border:#ffe08a;
  --warn-text: #7a5800;
  --tip-bg:    #edfbf3;
  --tip-border:#a8efca;
  --tip-text:  #0a6638;
  --code-bg:   #f0efe9;
  --code-border:#e2e0d8;
  --topbar-h:  52px;
  --sidebar-w: 240px;
  --toc-w:     200px;
  --radius:    6px;
  --font-body: 'IBM Plex Sans KR', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --transition: 0.18s ease;
}
[data-theme="dark"] {
  --bg:        #141414;
  --bg2:       #1e1e1e;
  --bg3:       #242424;
  --sidebar-bg:#0e0e0e;
  --sidebar-fg:#6a6a62;
  --sidebar-hover:#1a1a1a;
  --sidebar-active:#f0efe9;
  --sidebar-accent:#c8f264;
  --text:      #e8e6de;
  --text2:     #9a9892;
  --text3:     #5a5a52;
  --border:    #2e2e2e;
  --border2:   #3a3a3a;
  --accent:    #c8f264;
  --accent-bg: #c8f264;
  --info-bg:   #0d1f33;
  --info-border:#1a4080;
  --info-text: #7ab8ff;
  --warn-bg:   #1f1800;
  --warn-border:#5a4000;
  --warn-text: #ffcc44;
  --tip-bg:    #0a1f12;
  --tip-border:#1a5a30;
  --tip-text:  #44d480;
  --code-bg:   #242424;
  --code-border:#2e2e2e;
}

/* ───────── RESET ───────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.7;transition:background var(--transition),color var(--transition)}
a{color:inherit;text-decoration:none}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none}
pre,code{font-family:var(--font-mono)}
img{max-width:100%;display:block}

/* ───────── SCROLLBAR ───────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ───────── TOPBAR ───────── */
#topbar {
  position: fixed; top:0; left:0; right:0; z-index:100;
  height: var(--topbar-h);
  background: var(--sidebar-bg);
  display: flex; align-items: center;
  padding: 0 16px;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
#sidebar-toggle {
  width:32px; height:32px; border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  color:#888;
  transition:background var(--transition),color var(--transition);
  flex-shrink:0;
}
#sidebar-toggle:hover{background:rgba(255,255,255,0.08);color:#ddd}
#sidebar-toggle svg{width:16px;height:16px}

#logo {
  display:flex;align-items:center;gap:8px;
  color:#e8e6de;font-size:14px;font-weight:500;letter-spacing:-0.01em;
}
#logo .logo-badge {
  background:var(--sidebar-accent);color:#111;
  font-size:10px;font-weight:500;
  padding:2px 7px;border-radius:20px;letter-spacing:0.03em;
}

#search-box {
  flex:1;max-width:320px;
  height:32px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius);
  display:flex;align-items:center;padding:0 10px;gap:8px;
  transition:background var(--transition),border-color var(--transition);
}
#search-box:focus-within{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2)}
#search-box svg{width:13px;height:13px;color:#666;flex-shrink:0}
#search-input {
  flex:1;background:none;border:none;outline:none;
  font-family:var(--font-body);font-size:13px;color:#ccc;
}
#search-input::placeholder{color:#555}
#search-shortcut {
  font-size:11px;color:#444;border:1px solid #333;border-radius:4px;
  padding:1px 5px;font-family:var(--font-mono);
}

.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar-icon-btn {
  width:32px;height:32px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  color:#888;
  transition:background var(--transition),color var(--transition);
}
.topbar-icon-btn:hover{background:rgba(255,255,255,0.08);color:#ddd}
.topbar-icon-btn svg{width:16px;height:16px}
#version-badge {
  font-size:11px;padding:3px 9px;border-radius:20px;
  background:rgba(200,242,100,0.15);color:var(--sidebar-accent);
  border:1px solid rgba(200,242,100,0.25);font-weight:500;
}

/* ───────── SEARCH DROPDOWN ───────── */
#search-results {
  position:fixed;top:calc(var(--topbar-h) + 4px);left:50%;
  transform:translateX(-50%);
  width:440px;max-width:90vw;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--radius);overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.12);
  display:none;z-index:200;
}
#search-results.show{display:block}
.sr-item {
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background var(--transition);
}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--bg3)}
.sr-item-icon{width:28px;height:28px;border-radius:5px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sr-item-icon svg{width:13px;height:13px;color:var(--text3)}
.sr-group{font-size:11px;color:var(--text3);margin-bottom:2px}
.sr-label{font-size:13px;color:var(--text);font-weight:500}
.sr-empty{padding:24px;text-align:center;font-size:13px;color:var(--text3)}
mark{background:rgba(200,242,100,0.4);color:inherit;border-radius:2px;padding:0 1px}

/* ───────── LAYOUT ───────── */
#layout {
  display:flex;
  padding-top:var(--topbar-h);
  min-height:100vh;
}

/* ───────── SIDEBAR ───────── */
#sidebar {
  position:fixed;top:var(--topbar-h);left:0;bottom:0;
  width:var(--sidebar-w);
  background:var(--sidebar-bg);
  overflow-y:auto;
  padding:16px 0 32px;
  transition:transform var(--transition),width var(--transition);
  z-index:90;
  border-right:1px solid rgba(255,255,255,0.05);
}
#sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar-w)))}

.nav-group-label {
  font-size:10px;font-weight:500;
  color:rgba(255,255,255,0.25);
  padding:16px 20px 6px;
  letter-spacing:0.09em;text-transform:uppercase;
}
.nav-group-label:first-child{padding-top:4px}

.nav-item {
  display:flex;align-items:center;gap:9px;
  padding:7px 20px;
  font-size:13px;color:var(--sidebar-fg);
  border-left:2px solid transparent;
  transition:all var(--transition);
  cursor:pointer;
}
.nav-item:hover{background:var(--sidebar-hover);color:#ccc}
.nav-item.active{
  color:var(--sidebar-active);font-weight:500;
  border-left-color:var(--sidebar-accent);
  background:rgba(200,242,100,0.07);
}
.nav-item svg{width:13px;height:13px;flex-shrink:0;opacity:0.6}
.nav-item.active svg{opacity:1}
.nav-badge{
  margin-left:auto;font-size:10px;padding:1px 6px;border-radius:10px;
  background:rgba(200,242,100,0.15);color:var(--sidebar-accent);
}

/* ───────── MAIN ───────── */
#main {
  flex:1;
  margin-left:var(--sidebar-w);
  margin-right:var(--toc-w);
  min-width:0;
  padding:40px 48px 80px;
  transition:margin-left var(--transition);
}
#main.sidebar-collapsed{margin-left:0}

/* ───────── TOC ───────── */
#toc-panel {
  position:fixed;top:var(--topbar-h);right:0;bottom:0;
  width:var(--toc-w);
  padding:32px 20px;
  overflow-y:auto;
  border-left:1px solid var(--border);
  background:var(--bg);
}
.toc-heading{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px}
.toc-link {
  display:block;font-size:12px;color:var(--text3);
  padding:4px 0 4px 10px;
  border-left:1.5px solid var(--border);
  transition:all var(--transition);cursor:pointer;
  line-height:1.4;
}
.toc-link:hover{color:var(--text);border-left-color:var(--border2)}
.toc-link.active{color:var(--text);border-left-color:var(--text);font-weight:500}
.toc-link.sub{padding-left:20px;font-size:11px}
.toc-divider{margin:16px 0;border:none;border-top:1px solid var(--border)}

/* ───────── BREADCRUMB ───────── */
#breadcrumb {
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--text3);margin-bottom:24px;
}
#breadcrumb span{transition:color var(--transition)}
#breadcrumb span:last-child{color:var(--text)}
#breadcrumb .sep{color:var(--border2)}

/* ───────── CONTENT ───────── */
#doc-title{font-size:26px;font-weight:500;letter-spacing:-0.02em;margin-bottom:8px;line-height:1.3}
#doc-meta{font-size:12px;color:var(--text3);margin-bottom:36px;display:flex;gap:16px;flex-wrap:wrap}
#doc-meta span{display:flex;align-items:center;gap:5px}
#doc-meta svg{width:12px;height:12px}
#doc-content h2 {
  font-size:17px;font-weight:500;margin:40px 0 12px;
  padding-bottom:8px;border-bottom:1px solid var(--border);
  letter-spacing:-0.01em;
}
#doc-content h3{font-size:14px;font-weight:500;margin:24px 0 8px;color:var(--text)}
#doc-content p{font-size:13.5px;color:var(--text2);line-height:1.8;margin-bottom:14px}
#doc-content ul,#doc-content ol{padding-left:20px;margin-bottom:14px}
#doc-content li{font-size:13.5px;color:var(--text2);line-height:1.8;margin-bottom:4px}
#doc-content strong{font-weight:500;color:var(--text)}
#doc-content code:not(pre code){
  font-family:var(--font-mono);font-size:12px;
  background:var(--code-bg);border:1px solid var(--code-border);
  border-radius:4px;padding:1px 5px;color:var(--text);
}
#doc-content a{color:var(--info-text);border-bottom:1px solid transparent;transition:border-color var(--transition)}
#doc-content a:hover{border-bottom-color:var(--info-text)}

/* ───────── CODE BLOCK ───────── */
.code-block {
  background:var(--sidebar-bg);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:var(--radius);
  margin:16px 0;overflow:hidden;
}
[data-theme="light"] .code-block{background:#1e1e2e;border-color:#2e2e3e}
.code-header {
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.03);
}
.code-lang{font-size:11px;color:#666;font-family:var(--font-mono);font-weight:500;letter-spacing:0.05em}
.copy-btn {
  font-size:11px;font-family:var(--font-body);
  padding:3px 10px;border-radius:4px;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.05);
  color:#888;
  transition:all var(--transition);
  display:flex;align-items:center;gap:5px;
}
.copy-btn:hover{background:rgba(255,255,255,0.1);color:#ccc;border-color:rgba(255,255,255,0.2)}
.copy-btn.copied{color:var(--sidebar-accent);border-color:rgba(200,242,100,0.3)}
.copy-btn svg{width:11px;height:11px}
.code-body{padding:16px;overflow-x:auto}
.code-body pre{margin:0;font-size:12.5px;line-height:1.7;color:#abb2bf}
/* simple syntax colors */
.kw{color:#c678dd}.fn{color:#61afef}.str{color:#98c379}
.cm{color:#5c6370;font-style:italic}.num{color:#d19a66}
.tag{color:#e06c75}.attr{color:#d19a66}.prop{color:#abb2bf}

/* ───────── CALLOUT ───────── */
.callout {
  border-radius:var(--radius);padding:12px 16px;margin:16px 0;
  display:flex;gap:10px;align-items:flex-start;
  border-left:3px solid;
}
.callout svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.callout-body{font-size:13px;line-height:1.7}
.callout-body strong{font-size:12px;display:block;margin-bottom:2px;font-weight:500}
.callout.info{background:var(--info-bg);border-color:var(--info-border);color:var(--info-text)}
.callout.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text)}
.callout.tip {background:var(--tip-bg); border-color:var(--tip-border); color:var(--tip-text)}

/* ───────── TABLE ───────── */
.doc-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.doc-table th{text-align:left;padding:9px 14px;background:var(--bg3);color:var(--text);font-weight:500;border-bottom:1px solid var(--border2)}
.doc-table td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top}
.doc-table tr:last-child td{border-bottom:none}
.doc-table tr:hover td{background:var(--bg3)}
.tbl-code{font-family:var(--font-mono);font-size:11.5px;background:var(--code-bg);padding:1px 6px;border-radius:4px;border:1px solid var(--code-border);color:var(--text)}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
.badge-good{background:var(--tip-bg);color:var(--tip-text);border:1px solid var(--tip-border)}
.badge-warn{background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border)}
.badge-info{background:var(--info-bg);color:var(--info-text);border:1px solid var(--info-border)}

/* ───────── PAGE NAV ───────── */
#page-nav {
  display:flex;justify-content:space-between;gap:12px;
  margin-top:56px;padding-top:24px;border-top:1px solid var(--border);
}
.page-nav-btn {
  flex:1;padding:14px 18px;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg2);color:var(--text2);
  transition:all var(--transition);text-align:left;
  max-width:220px;
}
.page-nav-btn:hover{border-color:var(--border2);color:var(--text);background:var(--bg3)}
.page-nav-btn.next{text-align:right;margin-left:auto}
.page-nav-label{font-size:11px;color:var(--text3);margin-bottom:3px;display:block}
.page-nav-title{font-size:13px;font-weight:500}

/* ───────── RESPONSIVE ───────── */
@media(max-width:1100px){
  #toc-panel{display:none}
  #main{margin-right:0}
}
@media(max-width:768px){
  #sidebar{transform:translateX(calc(-1 * var(--sidebar-w)))}
  #sidebar.mobile-open{transform:translateX(0)}
  #main{margin-left:0;padding:24px 20px 60px}
  #mobile-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:89;display:none}
  #mobile-overlay.show{display:block}
  #doc-title{font-size:20px}
}

/* ───────── MISC ───────── */
.section-divider{margin:40px 0;border:none;border-top:1px solid var(--border)}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}

#scroll-top {
  position:fixed;bottom:24px;right:24px;
  width:36px;height:36px;border-radius:50%;
  background:var(--sidebar-bg);border:1px solid rgba(255,255,255,0.1);
  color:#888;display:none;align-items:center;justify-content:center;
  transition:all var(--transition);z-index:50;
}
#scroll-top.show{display:flex}
#scroll-top:hover{color:#ccc;background:#2a2a2a}
#scroll-top svg{width:14px;height:14px}

.loading-bar{position:fixed;top:0;left:0;height:2px;background:var(--sidebar-accent);width:0%;transition:width 0.2s;z-index:999}
</style>
</head>
<body>

<div class="loading-bar" id="loading-bar"></div>
<div id="mobile-overlay" onclick="closeMobile()"></div>
<div id="search-results"></div>

<!-- ── TOPBAR ── -->
<header id="topbar">
  <button id="sidebar-toggle" onclick="toggleSidebar()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
    </svg>
  </button>
  <div id="logo">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect x="1" y="1" width="7" height="7" rx="1.5" fill="#c8f264"/>
      <rect x="10" y="1" width="7" height="3" rx="1" fill="rgba(255,255,255,0.3)"/>
      <rect x="10" y="6" width="4" height="2" rx="1" fill="rgba(255,255,255,0.15)"/>
      <rect x="1" y="10" width="16" height="2" rx="1" fill="rgba(255,255,255,0.15)"/>
      <rect x="1" y="14" width="10" height="2" rx="1" fill="rgba(255,255,255,0.1)"/>
    </svg>
    Publisher Guide
    <span class="logo-badge">v2.4</span>
  </div>

  <div id="search-box">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/>
    </svg>
    <input type="text" id="search-input" placeholder="문서 검색..." autocomplete="off" oninput="doSearch(this.value)" onkeydown="searchKey(event)">
    <span id="search-shortcut">⌘K</span>
  </div>

  <div class="topbar-right">
    <button class="topbar-icon-btn" onclick="toggleDark()" id="dark-btn" title="다크모드 토글">
      <svg id="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="8" cy="8" r="3"/><line x1="8" y1="1" x2="8" y2="2.5"/><line x1="8" y1="13.5" x2="8" y2="15"/>
        <line x1="1" y1="8" x2="2.5" y2="8"/><line x1="13.5" y1="8" x2="15" y2="8"/>
        <line x1="3" y1="3" x2="4.1" y2="4.1"/><line x1="11.9" y1="11.9" x2="13" y2="13"/>
        <line x1="13" y1="3" x2="11.9" y2="4.1"/><line x1="4.1" y1="11.9" x2="3" y2="13"/>
      </svg>
      <svg id="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none">
        <path d="M13.5 10.5A6 6 0 0 1 5.5 2.5a6 6 0 1 0 8 8z"/>
      </svg>
    </button>
  </div>
</header>

<!-- ── SIDEBAR ── -->
<nav id="sidebar"></nav>

<!-- ── LAYOUT ── -->
<div id="layout">
  <main id="main">
    <nav id="breadcrumb"></nav>
    <h1 id="doc-title"></h1>
    <div id="doc-meta"></div>
    <div id="doc-content"></div>
    <nav id="page-nav"></nav>
  </main>
  <aside id="toc-panel">
    <div class="toc-heading">이 페이지</div>
    <div id="toc-list"></div>
  </aside>
</div>

<button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <polyline points="3,10 8,5 13,10"/>
  </svg>
</button>

<script>
/* ═══════════════════════════════════════════════
   DATA — 메뉴 & 콘텐츠 하드코딩
   새 페이지 추가: MENU에 항목, PAGES에 내용 추가
═══════════════════════════════════════════════ */
const MENU = [
  { group: '시작하기', items: [
    { id: 'overview',    label: '개요',        icon: 'book' },
    { id: 'setup',       label: '환경 설정',   icon: 'settings' },
    { id: 'quickstart',  label: '빠른 시작',   icon: 'zap', badge: 'NEW' },

        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="1.5,9 5.5,13 14.5,3"/></svg>
        <div class="callout-body"><strong>권장</strong>컴포넌트 내부 간격은 그리드 시스템과 분리해서 관리하세요. 컴포넌트 자체 padding은 그리드 gutter에 영향을 받지 않습니다.</div>
      </div>
    `
  },

          <tr><td>코드</td><td><span class="tbl-code">JetBrains Mono</span></td><td>코드 블록, 인라인 코드</td></tr>

      </table>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">css</span><button class="copy-btn" onclick="copyCode(this,'c-font')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-font"><span class="prop">:root</span> {

      <h2 id="s-scale">타입 스케일</h2>

          <tr><td><span class="tbl-code">small</span></td><td>13px</td><td>400</td><td>보조 텍스트</td></tr>

  color: {
    title: '색상 팔레트',
    group: '기본 원칙',
    updated: '2024-12-10',
    readTime: '4분',
    prev: { id: 'typography', label: '타이포그래피' },
    next: { id: 'spacing', label: '간격 규칙' },
    toc: [
      { id: 's-primary',   label: '브랜드 컬러',   level: 1 },

      { id: 's-darkmode',  label: '다크모드 대응', level: 1 },
    ],
    content: `
      <h2 id="s-primary">브랜드 컬러</h2>
      <p>모든 색상은 CSS 변수로 관리합니다. 직접 hex 값을 쓰지 마세요.</p>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">css</span><button class="copy-btn" onclick="copyCode(this,'c-color')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-color"><span class="prop">:root</span> {
  <span class="cm">/* 브랜드 */</span>
  <span class="attr">--color-primary</span>:      <span class="num">#1a1a1a</span>;
  <span class="attr">--color-primary-hover</span>:<span class="num">#333333</span>;
  <span class="attr">--color-accent</span>:       <span class="num">#c8f264</span>;

  <span class="cm">/* 텍스트 */</span>
  <span class="attr">--color-text</span>:         <span class="num">#1a1a1a</span>;
  <span class="attr">--color-text-muted</span>:   <span class="num">#5a5a52</span>;
  <span class="attr">--color-text-faint</span>:   <span class="num">#9a9a90</span>;

  <span class="cm">/* 배경 */</span>
  <span class="attr">--color-bg</span>:           <span class="num">#f7f6f2</span>;
  <span class="attr">--color-surface</span>:      <span class="num">#ffffff</span>;
  <span class="attr">--color-subtle</span>:       <span class="num">#f0efe9</span>;
}</pre></div>
      </div>
      <h2 id="s-semantic">시맨틱 컬러</h2>
      <table class="doc-table">
        <thead><tr><th>역할</th><th>변수명</th><th>상태</th></tr></thead>
        <tbody>
          <tr><td>성공</td><td><span class="tbl-code">--color-success</span></td><td><span class="badge badge-good">정상</span></td></tr>
          <tr><td>경고</td><td><span class="tbl-code">--color-warning</span></td><td><span class="badge badge-warn">주의</span></td></tr>
          <tr><td>오류</td><td><span class="tbl-code">--color-danger</span></td><td><span class="badge" style="background:#fde8e8;color:#c0392b;border:1px solid #f5b7b7">위험</span></td></tr>
          <tr><td>정보</td><td><span class="tbl-code">--color-info</span></td><td><span class="badge badge-info">안내</span></td></tr>
        </tbody>
      </table>
      <h2 id="s-darkmode">다크모드 대응</h2>
      <p>CSS 변수를 사용하면 다크모드 대응이 자동화됩니다. <code>[data-theme="dark"]</code> 속성으로 전환합니다.</p>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">css</span><button class="copy-btn" onclick="copyCode(this,'c-dark')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-dark"><span class="prop">[data-theme="dark"]</span> {
  <span class="attr">--color-bg</span>:      <span class="num">#141414</span>;
  <span class="attr">--color-surface</span>: <span class="num">#1e1e1e</span>;
  <span class="attr">--color-text</span>:    <span class="num">#e8e6de</span>;
}

<span class="cm">/* JS로 전환 */</span>
<span class="fn">document</span>.<span class="fn">documentElement</span>.<span class="fn">setAttribute</span>(
  <span class="str">'data-theme'</span>, <span class="str">'dark'</span>
);</pre></div>
      </div>
    `
  },

  spacing: {
    title: '간격 규칙',
    group: '기본 원칙',
    updated: '2024-11-28',
    readTime: '3분',
    prev: { id: 'color', label: '색상 팔레트' },

    ],
    content: `
      <h2 id="s-scale">간격 스케일</h2>
      <p>4px 배수 시스템을 기반으로 간격을 정의합니다. CSS 변수로 관리하세요.</p>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">css</span><button class="copy-btn" onclick="copyCode(this,'c-space')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-space"><span class="prop">:root</span> {
  <span class="attr">--sp-1</span>:  <span class="num">4px</span>;   <span class="cm">/* 극소 */</span>
  <span class="attr">--sp-2</span>:  <span class="num">8px</span>;   <span class="cm">/* 소 */</span>
  <span class="attr">--sp-3</span>:  <span class="num">12px</span>;  <span class="cm">/* 중소 */</span>
  <span class="attr">--sp-4</span>:  <span class="num">16px</span>;  <span class="cm">/* 중 */</span>
  <span class="attr">--sp-6</span>:  <span class="num">24px</span>;  <span class="cm">/* 대 */</span>
  <span class="attr">--sp-8</span>:  <span class="num">32px</span>;  <span class="cm">/* 특대 */</span>
  <span class="attr">--sp-12</span>: <span class="num">48px</span>;  <span class="cm">/* 섹션 간격 */</span>
  <span class="attr">--sp-16</span>: <span class="num">64px</span>;  <span class="cm">/* 페이지 간격 */</span>
}</pre></div>
      </div>
      <h2 id="s-usage">사용 원칙</h2>
      <ul>
        <li>컴포넌트 내부 패딩: <code>--sp-2</code> ~ <code>--sp-4</code></li>
        <li>컴포넌트 간 간격: <code>--sp-4</code> ~ <code>--sp-6</code></li>
        <li>섹션 간 간격: <code>--sp-12</code> ~ <code>--sp-16</code></li>
        <li>임의 픽셀값 사용 금지 — 반드시 변수 사용</li>
      </ul>
      <div class="callout warn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1.5L14.5 13H1.5L8 1.5z"/><line x1="8" y1="6" x2="8" y2="9.5"/><circle cx="8" cy="11.5" r="0.5" fill="currentColor"/></svg>
        <div class="callout-body"><strong>매직 넘버 금지</strong><code>margin: 13px</code>, <code>padding: 7px</code> 같은 임의의 숫자는 사용하지 마세요. 반드시 스케일 변수를 사용하거나, 필요하면 디자인팀에 변수 추가를 요청하세요.</div>
      </div>
    `
  },

    ],
    content: `
      <h2 id="s-types">버튼 종류</h2>
      <p>버튼은 4가지 종류만 사용합니다. 임의로 스타일을 변형하지 마세요.</p>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">html</span><button class="copy-btn" onclick="copyCode(this,'c-btn')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-btn"><span class="cm">&lt;!-- Primary: 핵심 액션 --&gt;</span>
<span class="tag">&lt;button</span> <span class="attr">class</span>=<span class="str">"btn btn--primary"</span><span class="tag">&gt;</span>저장하기<span class="tag">&lt;/button&gt;</span>

<span class="cm">&lt;!-- Secondary: 보조 액션 --&gt;</span>
<span class="tag">&lt;button</span> <span class="attr">class</span>=<span class="str">"btn btn--secondary"</span><span class="tag">&gt;</span>취소<span class="tag">&lt;/button&gt;</span>

<span class="cm">&lt;!-- Ghost: 강조 불필요한 액션 --&gt;</span>
<span class="tag">&lt;button</span> <span class="attr">class</span>=<span class="str">"btn btn--ghost"</span><span class="tag">&gt;</span>더보기<span class="tag">&lt;/button&gt;</span>

<span class="cm">&lt;!-- Danger: 파괴적 액션 --&gt;</span>
<span class="tag">&lt;button</span> <span class="attr">class</span>=<span class="str">"btn btn--danger"</span><span class="tag">&gt;</span>삭제<span class="tag">&lt;/button&gt;</span></pre></div>
      </div>
      <h2 id="s-size">버튼 크기</h2>
      <table class="doc-table">
        <thead><tr><th>크기</th><th>클래스</th><th>높이</th><th>패딩</th><th>폰트</th></tr></thead>
        <tbody>
          <tr><td>Large</td><td><span class="tbl-code">btn--lg</span></td><td>48px</td><td>0 24px</td><td>15px</td></tr>
          <tr><td>Medium (기본)</td><td>-</td><td>40px</td><td>0 18px</td><td>14px</td></tr>
          <tr><td>Small</td><td><span class="tbl-code">btn--sm</span></td><td>32px</td><td>0 12px</td><td>13px</td></tr>
          <tr><td>X-Small</td><td><span class="tbl-code">btn--xs</span></td><td>26px</td><td>0 10px</td><td>12px</td></tr>
        </tbody>
      </table>
      <h2 id="s-state">상태 스타일</h2>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">css</span><button class="copy-btn" onclick="copyCode(this,'c-btnst')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-btnst"><span class="prop">.btn</span>:hover   { <span class="attr">opacity</span>: <span class="num">0.88</span>; }
<span class="prop">.btn</span>:active  { <span class="attr">transform</span>: <span class="fn">scale</span>(<span class="num">0.98</span>); }
<span class="prop">.btn</span>:disabled {
  <span class="attr">opacity</span>: <span class="num">0.4</span>;
  <span class="attr">cursor</span>: not-allowed;
  <span class="attr">pointer-events</span>: none;
}
<span class="prop">.btn.is-loading</span> {
  <span class="attr">pointer-events</span>: none;
  <span class="cm">/* 스피너 아이콘 삽입 */</span>
}</pre></div>
      </div>
    `
  },

  'html-rules': {
    title: 'HTML 구조 규칙',

    prev: { id: 'responsive', label: '반응형 규칙' },

    toc: [
      { id: 's-semantic', label: '시맨틱 태그',    level: 1 },
      { id: 's-attr',     label: '필수 속성',      level: 1 },
      { id: 's-indent',   label: '들여쓰기 규칙',  level: 1 },
      { id: 's-comment',  label: '주석 규칙',      level: 1 },
    ],
    content: `
      <h2 id="s-semantic">시맨틱 태그</h2>
      <p>의미에 맞는 HTML 태그를 사용해 접근성과 SEO를 개선하세요.</p>
      <table class="doc-table">
        <thead><tr><th>태그</th><th>용도</th><th>주의사항</th></tr></thead>
        <tbody>
          <tr><td><span class="tbl-code">&lt;header&gt;</span></td><td>페이지/섹션 헤더</td><td>페이지당 1개 권장</td></tr>
          <tr><td><span class="tbl-code">&lt;nav&gt;</span></td><td>주요 네비게이션</td><td>aria-label 필수</td></tr>
          <tr><td><span class="tbl-code">&lt;main&gt;</span></td><td>주요 콘텐츠</td><td>페이지당 반드시 1개</td></tr>
          <tr><td><span class="tbl-code">&lt;article&gt;</span></td><td>독립적 콘텐츠 단위</td><td>블로그 글, 카드 등</td></tr>
          <tr><td><span class="tbl-code">&lt;section&gt;</span></td><td>주제별 섹션 구분</td><td>제목 태그 포함 권장</td></tr>
          <tr><td><span class="tbl-code">&lt;aside&gt;</span></td><td>보조 콘텐츠</td><td>사이드바, 광고 영역</td></tr>
        </tbody>
      </table>
      <h2 id="s-attr">필수 속성</h2>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">html</span><button class="copy-btn" onclick="copyCode(this,'c-attr')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-attr"><span class="cm">&lt;!-- 이미지: alt 필수 --&gt;</span>
<span class="tag">&lt;img</span> <span class="attr">src</span>=<span class="str">"photo.jpg"</span> <span class="attr">alt</span>=<span class="str">"팀 단체 사진"</span> <span class="attr">width</span>=<span class="str">"800"</span> <span class="attr">height</span>=<span class="str">"600"</span><span class="tag">&gt;</span>

<span class="cm">&lt;!-- 링크: 빈 href 금지 --&gt;</span>
<span class="tag">&lt;a</span> <span class="attr">href</span>=<span class="str">"/about"</span><span class="tag">&gt;</span>회사 소개<span class="tag">&lt;/a&gt;</span>

<span class="cm">&lt;!-- 외부 링크: 보안 속성 추가 --&gt;</span>
<span class="tag">&lt;a</span> <span class="attr">href</span>=<span class="str">"https://..."</span> <span class="attr">target</span>=<span class="str">"_blank"</span>
   <span class="attr">rel</span>=<span class="str">"noopener noreferrer"</span><span class="tag">&gt;</span>외부 링크<span class="tag">&lt;/a&gt;</span>

<span class="cm">&lt;!-- 버튼: type 필수 --&gt;</span>
<span class="tag">&lt;button</span> <span class="attr">type</span>=<span class="str">"button"</span><span class="tag">&gt;</span>클릭<span class="tag">&lt;/button&gt;</span>
<span class="tag">&lt;button</span> <span class="attr">type</span>=<span class="str">"submit"</span><span class="tag">&gt;</span>제출<span class="tag">&lt;/button&gt;</span></pre></div>

  'css-naming': {
    title: 'CSS 네이밍',
    group: '코딩 규칙',
    updated: '2025-01-08',
    readTime: '5분',
    prev: { id: 'html-rules', label: 'HTML 구조 규칙' },
    next: { id: 'js-pattern', label: 'JS 패턴' },
    toc: [
      { id: 's-bem',    label: 'BEM 방법론',    level: 1 },
      { id: 's-prefix', label: '접두사 규칙',   level: 1 },
      { id: 's-var',    label: 'CSS 변수 네이밍', level: 1 },
    ],
    content: `
      <h2 id="s-bem">BEM 방법론</h2>
      <p>Block, Element, Modifier 방식으로 클래스 이름을 작성합니다.</p>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">css</span><button class="copy-btn" onclick="copyCode(this,'c-bem')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-bem"><span class="cm">/* Block: 독립적인 컴포넌트 */</span>
<span class="prop">.card</span> { }

<span class="cm">/* Element: 블록의 구성 요소 (__) */</span>
<span class="prop">.card__header</span> { }
<span class="prop">.card__body</span>   { }
<span class="prop">.card__footer</span> { }
<span class="prop">.card__title</span>  { }
<span class="prop">.card__image</span>  { }

<span class="cm">/* Modifier: 상태나 변형 (--) */</span>
<span class="prop">.card--featured</span>  { }
<span class="prop">.card--dark</span>       { }
<span class="prop">.card--horizontal</span> { }</pre></div>
      </div>
      <h2 id="s-prefix">접두사 규칙</h2>
      <table class="doc-table">
        <thead><tr><th>접두사</th><th>용도</th><th>예시</th></tr></thead>
        <tbody>
          <tr><td><span class="tbl-code">is-</span></td><td>상태 클래스</td><td><span class="tbl-code">is-active</span>, <span class="tbl-code">is-open</span></td></tr>
          <tr><td><span class="tbl-code">has-</span></td><td>자식 요소 존재 여부</td><td><span class="tbl-code">has-icon</span>, <span class="tbl-code">has-badge</span></td></tr>
          <tr><td><span class="tbl-code">js-</span></td><td>JS 훅 (스타일 없음)</td><td><span class="tbl-code">js-toggle</span></td></tr>
          <tr><td><span class="tbl-code">u-</span></td><td>유틸리티</td><td><span class="tbl-code">u-sr-only</span>, <span class="tbl-code">u-hidden</span></td></tr>
        </tbody>
      </table>
      <h2 id="s-var">CSS 변수 네이밍</h2>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">css</span><button class="copy-btn" onclick="copyCode(this,'c-varname')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-varname"><span class="cm">/* 패턴: --[범주]-[속성]-[변형] */</span>
<span class="attr">--color-text-primary</span>
<span class="attr">--color-text-muted</span>
<span class="attr">--color-bg-surface</span>
<span class="attr">--size-font-body</span>
<span class="attr">--space-gap-md</span>
<span class="attr">--radius-card</span>
<span class="attr">--shadow-dropdown</span></pre></div>
      </div>
    `
  },

  perf: {
    title: '성능 최적화',
    group: '코딩 규칙',
    updated: '2025-01-08',

    prev: { id: 'js-pattern', label: 'JS 패턴' },

    toc: [
      { id: 's-img',    label: '이미지 최적화',  level: 1 },

      { id: 's-js',     label: 'JS 로딩 전략',  level: 1 },
    ],
    content: `
      <h2 id="s-img">이미지 최적화</h2>
      <p>이미지는 페이지 용량의 대부분을 차지합니다. 아래 규칙을 준수하세요.</p>
      <ul>
        <li>PNG → WebP 변환 우선 사용 (용량 25~35% 절감)</li>
        <li>아이콘은 SVG 스프라이트 사용 (별도 아이콘 시스템 가이드 참조)</li>
        <li><code>width</code>, <code>height</code> 속성 반드시 명시 (Layout Shift 방지)</li>
        <li>뷰포트 밖 이미지에 <code>loading="lazy"</code> 적용</li>
      </ul>
      <h2 id="s-css">CSS 최적화</h2>
      <ul>
        <li>CSS 파일은 <code>&lt;head&gt;</code> 상단에서 로드 (렌더 블로킹 방지)</li>
        <li>사용하지 않는 셀렉터 제거 (PurgeCSS 활용)</li>
        <li>애니메이션은 <code>transform</code>, <code>opacity</code>만 사용 (GPU 가속)</li>
      </ul>
      <h2 id="s-js">JS 로딩 전략</h2>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">html</span><button class="copy-btn" onclick="copyCode(this,'c-perf-js')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-perf-js"><span class="cm">&lt;!-- defer: DOM 파싱 완료 후 실행 (권장) --&gt;</span>
<span class="tag">&lt;script</span> <span class="attr">src</span>=<span class="str">"app.js"</span> <span class="attr">defer</span><span class="tag">&gt;&lt;/script&gt;</span>

<span class="cm">&lt;!-- async: 다운로드 즉시 실행 (독립 스크립트) --&gt;</span>
<span class="tag">&lt;script</span> <span class="attr">src</span>=<span class="str">"analytics.js"</span> <span class="attr">async</span><span class="tag">&gt;&lt;/script&gt;</span>

<span class="cm">&lt;!-- Kendo: body 닫기 태그 직전 로드 --&gt;</span>
<span class="tag">&lt;script</span> <span class="attr">src</span>=<span class="str">"kendo.all.min.js"</span><span class="tag">&gt;&lt;/script&gt;</span>
<span class="tag">&lt;script</span> <span class="attr">src</span>=<span class="str">"js/kendo-init.js"</span><span class="tag">&gt;&lt;/script&gt;</span></pre></div>
      </div>
    `
  },

  /* ─── 디자인 토큰 ─── */
  'tokens-overview': {
    title: '디자인 토큰 개요',
    group: '디자인 토큰',
    updated: '2025-01-15',
    readTime: '4분',
    prev: { id: 'perf', label: '성능 최적화' },
    next: { id: 'tokens-color', label: '컬러 토큰' },
    toc: [
      { id: 's-what',   label: '토큰이란',         level: 1 },
      { id: 's-struct', label: '토큰 구조',         level: 1 },
      { id: 's-file',   label: '파일 위치',         level: 1 },
      { id: 's-rule',   label: '사용 규칙',         level: 1 },
    ],
    content: `
      <h2 id="s-what">토큰이란</h2>
      <p>디자인 토큰은 색상, 폰트, 간격 등 UI의 시각적 속성을 CSS 변수로 중앙에서 관리하는 시스템입니다. 하드코딩된 값 대신 토큰을 사용하면 테마 변경, 유지보수, 다크모드 대응이 일관되게 처리됩니다.</p>
      <div class="callout info">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.5"/><line x1="8" y1="7" x2="8" y2="11"/><circle cx="8" cy="5" r="0.5" fill="currentColor"/></svg>
        <div class="callout-body"><strong>핵심 원칙</strong>코드에서 <code>#5C61D4</code>, <code>16px</code> 같은 값을 직접 쓰지 않습니다. 반드시 <code>var(--primary-500)</code>, <code>var(--font-size)</code> 형태의 토큰을 사용하세요.</div>
      </div>
      <h2 id="s-struct">토큰 구조</h2>
      <p>토큰은 3단계 계층으로 구성됩니다.</p>
      <table class="doc-table">
        <thead><tr><th>계층</th><th>설명</th><th>예시</th></tr></thead>
        <tbody>
          <tr><td><strong>원시(Primitive)</strong></td><td>팔레트의 실제 값</td><td><code>--primary-500: #5C61D4</code></td></tr>
          <tr><td><strong>시맨틱(Semantic)</strong></td><td>역할 기반 별칭</td><td><code>--text-primary</code>, <code>--btn-main</code></td></tr>
          <tr><td><strong>컴포넌트(Component)</strong></td><td>특정 컴포넌트 전용</td><td><code>--input-h</code>, <code>--acc-round</code></td></tr>
        </tbody>
      </table>
      <h2 id="s-file">파일 위치</h2>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">tree</span><button class="copy-btn" onclick="copyCode(this,'c-tok-tree')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-tok-tree">assets/css/
├── tokens/
│   ├── root-tokens.css   <span class="cm"># :root 변수 전체 정의 (v3.0)</span>
│   ├── color.css         <span class="cm"># 컬러 팔레트</span>
│   └── component.css     <span class="cm"># 컴포넌트 토큰</span>
└── base.css              <span class="cm"># @import tokens/root-tokens.css</span></pre></div>
      </div>
      <h2 id="s-rule">사용 규칙</h2>
      <ul>
        <li>원시 토큰(<code>--primary-500</code>)은 토큰 정의 파일에서만 사용</li>
        <li>컴포넌트 CSS에서는 시맨틱 토큰(<code>--btn-main</code>) 사용</li>
        <li>새 값이 필요하면 임의 하드코딩 금지 — 퍼블팀 리드에게 토큰 추가 요청</li>
      </ul>
    `
  },

  'tokens-color': {
    title: '컬러 토큰',
    group: '디자인 토큰',

    content: `
      <h2 id="s-primary">Primary 팔레트 (Slate Blue)</h2>
      <p>브랜드 컬러입니다. <code>--primary-500</code>이 기준값이며, 숫자가 클수록 어둡습니다.</p>
      <div style="display:flex;gap:4px;margin:12px 0 16px;border-radius:6px;overflow:hidden">
        <div style="flex:1;height:48px;background:#F8F9FD;display:flex;align-items:flex-end;padding:4px;font-size:10px;color:#999;font-family:var(--font-mono)">50</div>
        <div style="flex:1;height:48px;background:#F2F2FC;display:flex;align-items:flex-end;padding:4px;font-size:10px;color:#999;font-family:var(--font-mono)">100</div>
        <div style="flex:1;height:48px;background:#EBEBFA;display:flex;align-items:flex-end;padding:4px;font-size:10px;color:#aaa;font-family:var(--font-mono)">200</div>
        <div style="flex:1;height:48px;background:#999CE4;display:flex;align-items:flex-end;padding:4px;font-size:10px;color:#fff;font-family:var(--font-mono)">300</div>
        <div style="flex:1;height:48px;background:#7A7EE8;display:flex;align-items:flex-end;padding:4px;font-size:10px;color:#fff;font-family:var(--font-mono)">400</div>
        <div style="flex:1;height:48px;background:#5C61D4;display:flex;align-items:flex-end;padding:4px;font-size:10px;color:#fff;font-weight:600;font-family:var(--font-mono)">500★</div>
        <div style="flex:1;height:48px;background:#4549AB;display:flex;align-items:flex-end;padding:4px;font-size:10px;color:#fff;font-family:var(--font-mono)">600</div>

        <div style="flex:1;height:48px;background:#0A0B25;display:flex;align-items:flex-end;padding:4px;font-size:10px;color:#fff;font-family:var(--font-mono)">800</div>
      </div>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">css</span><button class="copy-btn" onclick="copyCode(this,'c-col-prim')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-col-prim"><span class="prop">:root</span> {
  <span class="attr">--primary-50</span>:  <span class="num">#F8F9FD</span>;
  <span class="attr">--primary-100</span>: <span class="num">#F2F2FC</span>;
  <span class="attr">--primary-200</span>: <span class="num">#EBEBFA</span>;
  <span class="attr">--primary-300</span>: <span class="num">#999CE4</span>;
  <span class="attr">--primary-400</span>: <span class="num">#7A7EE8</span>;
  <span class="attr">--primary-500</span>: <span class="num">#5C61D4</span>; <span class="cm">/* ★ 메인 브랜드 */</span>
  <span class="attr">--primary-600</span>: <span class="num">#4549AB</span>;
  <span class="attr">--primary-700</span>: <span class="num">#37396D</span>;
  <span class="attr">--primary-800</span>: <span class="num">#0A0B25</span>;
}</pre></div>

      <h2 id="s-neutral">Neutral 팔레트</h2>

      <div class="code-block">
        <div class="code-header"><span class="code-lang">css</span><button class="copy-btn" onclick="copyCode(this,'c-col-neu')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-col-neu"><span class="prop">:root</span> {
  <span class="attr">--black-300</span>: <span class="num">#B8B8B8</span>; <span class="cm">/* 비활성 텍스트 */</span>

      <h2 id="s-why">왜 SVG 스프라이트인가</h2>
      <p>기존에는 <code>icon_map.png</code> 스프라이트와 개별 PNG 파일이 혼재했습니다. v3.0부터 SVG 스프라이트 단일 방식으로 통합했습니다.</p>
      <table class="doc-table">
        <thead><tr><th>방식</th><th>HTTP 요청</th><th>색상 변경</th><th>레티나</th><th>관리</th></tr></thead>
        <tbody>
          <tr><td>PNG 개별</td><td><span class="badge badge-warn">N개</span></td><td>불가</td><td>@2x 별도 필요</td><td>보통</td></tr>
          <tr><td>PNG 스프라이트</td><td><span class="badge badge-good">1개</span></td><td>불가</td><td>background-size 필요</td><td>좌표 관리 불편</td></tr>
          <tr><td><strong>SVG 스프라이트 ✓</strong></td><td><span class="badge badge-good">1개</span></td><td><span class="badge badge-good">CSS 변수</span></td><td><span class="badge badge-good">자동</span></td><td>id로 직관적</td></tr>
        </tbody>
      </table>
      <div class="callout tip">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="1.5,9 5.5,13 14.5,3"/></svg>
        <div class="callout-body"><strong>hover 색상 변경 비교</strong>이전에는 <code>icon_logout.png</code> / <code>icon_logout_on.png</code> 두 파일이 필요했지만, 이제는 CSS 한 줄 <code>color: var(--primary-600)</code>으로 처리됩니다.</div>
      </div>
      <h2 id="s-files">파일 구성</h2>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">tree</span><button class="copy-btn" onclick="copyCode(this,'c-ico-tree')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>

├── images/

      </div>
      <h2 id="s-perf">성능 비교</h2>
      <p>PNG 방식 대비 SVG 스프라이트 전환 후 효과입니다.</p>

        <thead><tr><th>항목</th><th>이전</th><th>이후</th></tr></thead>

          <tr><td>hover 처리</td><td>별도 이미지 스왑</td><td>CSS color 전환</td></tr>

    content: `
      <h2 id="s-basic">기본 사용</h2>
      <p><code>&lt;body&gt;</code> 최상단에 스프라이트를 한 번 삽입하고, 이후 <code>&lt;use&gt;</code>로 참조합니다.</p>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">html</span><button class="copy-btn" onclick="copyCode(this,'c-ico-basic')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-ico-basic"><span class="cm">&lt;!-- body 최상단에 1회 삽입 --&gt;</span>
<span class="tag">&lt;svg</span> <span class="attr">style</span>=<span class="str">"display:none"</span><span class="tag">&gt;</span>
  <span class="tag">&lt;symbol</span> <span class="attr">id</span>=<span class="str">"search"</span> <span class="attr">viewBox</span>=<span class="str">"0 0 20 20"</span><span class="tag">&gt;</span>...<span class="tag">&lt;/symbol&gt;</span>

    content: `
      <h2 id="s-k-intro">관리자 환경 구성</h2>
      <p>관리자 페이지는 Kendo UI jQuery 기반으로 구성됩니다. 각 컴포넌트는 별도 JS 파일로 분리 관리합니다.</p>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">tree</span><button class="copy-btn" onclick="copyCode(this,'c-k-tree')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-k-tree">assets/js/kendo/
├── kendo-grid.js          <span class="cm"># Grid 초기화</span>
├── kendo-dropdown.js      <span class="cm"># DropDownList / MultiSelect / AutoComplete</span>
├── kendo-datepicker.js    <span class="cm"># DatePicker / DateRangePicker / TimePicker</span>
├── kendo-numeric.js       <span class="cm"># NumericTextBox</span>
├── kendo-editor.js        <span class="cm"># Editor</span>
├── kendo-tab.js           <span class="cm"># TabStrip</span>
├── kendo-window.js        <span class="cm"># Window (팝업)</span>
├── kendo-treeview.js      <span class="cm"># TreeView</span>
└── kendo-splitter.js      <span class="cm"># Splitter</span></pre></div>
      </div>
      <h2 id="s-k-cdn">CDN / 파일 로드</h2>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">html</span><button class="copy-btn" onclick="copyCode(this,'c-k-cdn')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-k-cdn"><span class="tag">&lt;head&gt;</span>
  <span class="cm">&lt;!-- Kendo CSS (테마) --&gt;</span>
  <span class="tag">&lt;link</span> <span class="attr">rel</span>=<span class="str">"stylesheet"</span>
    <span class="attr">href</span>=<span class="str">"kendo/css/kendo.common.min.css"</span><span class="tag">&gt;</span>
  <span class="tag">&lt;link</span> <span class="attr">rel</span>=<span class="str">"stylesheet"</span>
    <span class="attr">href</span>=<span class="str">"kendo/css/kendo.custom.css"</span><span class="tag">&gt;</span>
<span class="tag">&lt;/head&gt;</span>
<span class="tag">&lt;body&gt;</span>

<span class="tag">&lt;/body&gt;</span></pre></div>
      </div>
      <h2 id="s-k-theme">테마 커스터마이징</h2>
      <p>Kendo 기본 테마에 디자인 토큰을 덮어씁니다. <code>kendo.custom.css</code>에서 관리합니다.</p>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">css</span><button class="copy-btn" onclick="copyCode(this,'c-k-theme')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사</button></div>
        <div class="code-body"><pre id="c-k-theme"><span class="cm">/* 포커스/선택 컬러 → primary 토큰 적용 */</span>
<span class="prop">.k-state-focused,
.k-state-selected</span> {
  <span class="attr">border-color</span>: <span class="fn">var</span>(--primary-500) <span class="kw">!important</span>;
  <span class="attr">color</span>: <span class="fn">var</span>(--primary-600) <span class="kw">!important</span>;
}
<span class="prop">.k-list .k-item.k-state-selected</span> {
  <span class="attr">background</span>: <span class="fn">var</span>(--primary-100);
  <span class="attr">color</span>: <span class="fn">var</span>(--primary-700);
}
<span class="cm">/* 높이 토큰 통일 */</span>
<span class="prop">.k-dropdown,
.k-datepicker,
.k-timepicker</span> {
  <span class="attr">height</span>: <span class="fn">var</span>(--input-h-big, <span class="num">42px</span>);

const SEARCH_INDEX = [];
for (const [id, page] of Object.entries(PAGES)) {
  SEARCH_INDEX.push({ id, label: page.title, group: page.group, type: 'page' });
  (page.toc || []).forEach(t => {
    SEARCH_INDEX.push({ id, anchor: t.id, label: t.label, group: page.title, type: 'section' });
  });
}

   STATE

let currentPageId = 'overview';
let sidebarOpen = true;

/* ═══════════════════════════════════════
   RENDER SIDEBAR
═══════════════════════════════════════ */
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = MENU.map(group => `
    <div class="nav-group-label">${group.group}</div>
    ${group.items.map(item => `
      <div class="nav-item ${item.id === currentPageId ? 'active' : ''}"
           onclick="loadPage('${item.id}')"
           data-id="${item.id}">
        ${ICONS[item.icon] || ICONS.book}
        ${item.label}
        ${item.badge ? `<span class="nav-badge">${item.badge}</span>` : ''}
      </div>
    `).join('')}
  `).join('');
}

/* ═══════════════════════════════════════
   RENDER PAGE
═══════════════════════════════════════ */
function loadPage(id, anchor) {
  const page = PAGES[id];
  if (!page) return;

  showLoadingBar();
  currentPageId = id;

  // breadcrumb
  document.getElementById('breadcrumb').innerHTML =
    `<span>홈</span><span class="sep">›</span><span>${page.group}</span><span class="sep">›</span><span>${page.title}</span>`;

  // title
  document.getElementById('doc-title').textContent = page.title;

  // meta
  document.getElementById('doc-meta').innerHTML = `
    <span><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="1" y="2" width="12" height="11" rx="1.5"/><line x1="1" y1="6" x2="13" y2="6"/><line x1="4.5" y1="4" x2="4.5" y2="1"/><line x1="9.5" y1="4" x2="9.5" y2="1"/></svg>${page.updated}</span>
    <span><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="5.5"/><polyline points="7,4 7,7 9.5,9"/></svg>읽는 시간 약 ${page.readTime}</span>
  `;

  // content
  document.getElementById('doc-content').innerHTML = page.content;

  // toc
  const tocList = document.getElementById('toc-list');
  tocList.innerHTML = (page.toc || []).map(t => `
    <a class="toc-link ${t.level === 2 ? 'sub' : ''}" onclick="scrollToSection('${t.id}')">${t.label}</a>
  `).join('');

  // page nav
  const prev = page.prev;
  const next = page.next;
  document.getElementById('page-nav').innerHTML = `
    ${prev ? `<button class="page-nav-btn" onclick="loadPage('${prev.id}')"><span class="page-nav-label">← 이전</span><span class="page-nav-title">${prev.label}</span></button>` : '<div></div>'}
    ${next ? `<button class="page-nav-btn next" onclick="loadPage('${next.id}')"><span class="page-nav-label">다음 →</span><span class="page-nav-title">${next.label}</span></button>` : '<div></div>'}
  `;

  renderSidebar();
  updateTocActive();

  if (anchor) {
    setTimeout(() => scrollToSection(anchor), 80);
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  hideLoadingBar();
  closeMobile();
}

/* ═══════════════════════════════════════
   TOC SCROLL SPY
═══════════════════════════════════════ */
function updateTocActive() {
  const page = PAGES[currentPageId];
  if (!page || !page.toc) return;
  const links = document.querySelectorAll('.toc-link');
  const sections = page.toc.map(t => document.getElementById(t.id)).filter(Boolean);

  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        links.forEach(l => l.classList.remove('active'));
        const idx = sections.indexOf(entry.target);
        if (idx >= 0 && links[idx]) links[idx].classList.add('active');
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px' });

  sections.forEach(s => obs.observe(s));
}

function scrollToSection(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - 80;
  window.scrollTo({ top, behavior: 'smooth' });
}

/* ═══════════════════════════════════════
   SEARCH
═══════════════════════════════════════ */
function doSearch(q) {
  const panel = document.getElementById('search-results');
  if (!q.trim()) { panel.classList.remove('show'); return; }

  const results = SEARCH_INDEX.filter(item =>
    item.label.toLowerCase().includes(q.toLowerCase()) ||
    item.group.toLowerCase().includes(q.toLowerCase())
  ).slice(0, 8);

  if (!results.length) {
    panel.innerHTML = `<div class="sr-empty">검색 결과가 없습니다</div>`;
  } else {
    panel.innerHTML = results.map(r => {
      const hl = (s) => s.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
      return `
        <div class="sr-item" onclick="loadPage('${r.id}', '${r.anchor || ''}'); clearSearch();">
          <div class="sr-item-icon">${r.type === 'section' ? ICONS.hash : ICONS.book}</div>
          <div>
            <div class="sr-group">${hl(r.group)}</div>
            <div class="sr-label">${hl(r.label)}</div>
          </div>
        </div>`;
    }).join('');
  }
  panel.classList.add('show');
}

function searchKey(e) {
  if (e.key === 'Escape') clearSearch();
}
function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').classList.remove('show');
}
document.addEventListener('click', e => {
  if (!e.target.closest('#search-box') && !e.target.closest('#search-results')) clearSearch();
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('search-input').focus();
  }
});

/* ═══════════════════════════════════════
   COPY CODE
═══════════════════════════════════════ */
function copyCode(btn, id) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = el.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = `<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="1.5,8 5,11.5 12.5,3"/></svg>복사됨`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="5" width="7.5" height="7.5" rx="1.5"/><path d="M3 9H2a1.5 1.5 0 0 1-1.5-1.5V2A1.5 1.5 0 0 1 2 .5h5.5A1.5 1.5 0 0 1 9 2v1"/></svg>복사`;
    }, 2000);
  });
}

/* ═══════════════════════════════════════
   DARK MODE
═══════════════════════════════════════ */
function toggleDark() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  document.getElementById('icon-sun').style.display = isDark ? '' : 'none';
  document.getElementById('icon-moon').style.display = isDark ? 'none' : '';
}

/* ═══════════════════════════════════════
   SIDEBAR TOGGLE
═══════════════════════════════════════ */
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  const sb = document.getElementById('sidebar');
  const main = document.getElementById('main');
  if (window.innerWidth <= 768) {
    sb.classList.toggle('mobile-open', sidebarOpen);
    document.getElementById('mobile-overlay').classList.toggle('show', sidebarOpen);
  } else {
    sb.classList.toggle('collapsed', !sidebarOpen);
    main.classList.toggle('sidebar-collapsed', !sidebarOpen);
  }
}
function closeMobile() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('mobile-overlay').classList.remove('show');
  if (window.innerWidth <= 768) sidebarOpen = false;
}

/* ═══════════════════════════════════════
   LOADING BAR
═══════════════════════════════════════ */
function showLoadingBar() {
  const bar = document.getElementById('loading-bar');
  bar.style.width = '0%';
  bar.style.transition = 'none';
  requestAnimationFrame(() => {
    bar.style.transition = 'width 0.25s ease';
    bar.style.width = '80%';
  });
}
function hideLoadingBar() {
  const bar = document.getElementById('loading-bar');
  bar.style.width = '100%';
  setTimeout(() => { bar.style.width = '0%'; }, 300);
}

/* ═══════════════════════════════════════
   SCROLL TOP BUTTON
═══════════════════════════════════════ */
window.addEventListener('scroll', () => {
  document.getElementById('scroll-top').classList.toggle('show', window.scrollY > 300);
});

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
(function init() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  if (saved === 'dark') {
    document.getElementById('icon-sun').style.display = 'none';
    document.getElementById('icon-moon').style.display = '';
  }

  const hash = location.hash.slice(1);
  const startId = PAGES[hash] ? hash : 'overview';
  loadPage(startId);
})();
</script>
