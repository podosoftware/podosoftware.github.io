<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podo Publisher Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../resources/css/front_tokens.css">
    <link rel="stylesheet" href="../resources/css/style.css">

    <script src="../resources/js/jquery/jquery.min.js"></script>
</head>
<body>
<!-- ═══ 검색 오버레이 ═══ -->
<div id="search-modal" onclick="if(event.target===this)closeSearch()">
  <div class="search-box">
    <div class="search-input-row">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
      <input id="search-input" type="text" placeholder="문서 검색..." oninput="doSearch(this.value)" autocomplete="off">
      <button class="search-close" onclick="closeSearch()">ESC</button>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<!-- ═══ 사이드바 오버레이 ═══ -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- ═══ 상단 바 (고정) ═══ -->
<header id="topbar">
  <button id="menu-toggle" onclick="toggleSidebar()" aria-label="메뉴 열기">
    <svg id="icon-menu" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <line x1="2" y1="5"  x2="18" y2="5"/><line x1="2" y1="10" x2="18" y2="10"/><line x1="2" y1="15" x2="18" y2="15"/>
    </svg>
  </button>

  <div class="top-wordmark">
    Publisher Guide<sup>ADMIN</sup>
  </div>

  <div class="top-divider"></div>

  <div id="top-search" onclick="openSearch()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
    문서 검색
    <kbd>⌘K</kbd>
  </div>

  <div class="top-right">
    <span class="top-ver">v3.0</span>
    <button class="top-icon-btn" id="search-btn-mobile" style="display:none" onclick="openSearch()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
    </button>
    <button class="top-icon-btn" onclick="toggleTheme()" id="theme-btn" title="다크모드">
      <svg id="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.2M8 13.3v1.2M1.5 8h1.2M13.3 8h1.2M3.6 3.6l.85.85M11.55 11.55l.85.85M3.6 12.4l.85-.85M11.55 4.45l.85-.85"/></svg>
    </button>
  </div>
</header>

<!-- ═══ 사이드바 (고정, 메뉴는 JS 생성) ═══ -->
<nav id="sidebar">
  <div class="sidebar-inner">
    <!-- baseLayout.js에서 동적으로 렌더링됨 -->
  </div>
</nav>

<!-- ═══ 메인 레이아웃 (동적 콘텐츠) ═══ -->
<div id="layout">
  <div id="main">
    <!-- 페이지 콘텐츠가 여기에 동적으로 로드됨 -->
  </div>

  <!-- TOC (페이지별로 동적 생성) -->
  <aside id="toc-panel">
    <!-- baseLayout.js에서 동적으로 생성 -->
  </aside>
</div>

<!-- 모바일 하단 네비 -->
<nav id="bottom-nav">
  <div class="bn-item active">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 2h10a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H3"/><path d="M3 17V2"/><line x1="7" y1="7" x2="11" y2="7"/><line x1="7" y1="11" x2="10" y2="11"/></svg>
    <span>문서</span>
  </div>
  <div class="bn-item" onclick="toggleSidebar()">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="5" x2="18" y2="5"/><line x1="2" y1="10" x2="18" y2="10"/><line x1="2" y1="15" x2="14" y2="15"/></svg>
    <span>메뉴</span>
  </div>
  <div class="bn-item" onclick="openSearch()">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><line x1="14" y1="14" x2="18" y2="18"/></svg>
    <span>검색</span>
  </div>
  <div class="bn-item">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="4"/><path d="M10 2v1.5M10 16.5V18M2 10h1.5M16.5 10H18M4.2 4.2l1.1 1.1M14.7 14.7l1.1 1.1M4.2 15.8l1.1-1.1M14.7 5.3l1.1-1.1"/></svg>
    <span>설정</span>
  </div>
</nav>

<script src="../resources/js/guide/baseLayout.js"></script>
</body>
</html>
